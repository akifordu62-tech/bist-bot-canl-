name: BIST 100 Gunluk Otomatik Tarayici ve Telegram Botu

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) her gün 15:30 UTC (TSİ 18:30 borsa kapanış ve kesin veri saati)
    - cron: '30 15 * * 1-5'
    # Streamlit Cloud'un uyku moduna geçmesini önlemek için Pazar günü hafif ping
    - cron: '0 12 * * 0'
  workflow_dispatch: # GitHub web sitesinden manuel 'Run workflow' ile tetiklenebilir

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek (Checkout)
        uses: actions/checkout@v4

      - name: Streamlit Cloud Uyku Modunu Onle (Keep-Alive Ping)
        run: |
          echo "Streamlit Cloud uyanık tutuluyor..."
          curl -s -L -I "https://akif-bist-bot.streamlit.app" || true

      - name: Python 3.11 Kur
        if: github.event_name != 'schedule' || github.event.schedule == '30 15 * * 1-5'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari Yukle
        if: github.event_name != 'schedule' || github.event.schedule == '30 15 * * 1-5'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: BIST 100 Taramasini Calistir ve Telegrama Gonder
        if: github.event_name != 'schedule' || github.event.schedule == '30 15 * * 1-5'
        env:
          TELEGRAM_ENABLED: 'True'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from scanner import scan_symbols; from bist_symbols import BIST_100_SYMBOLS; scan_symbols(BIST_100_SYMBOLS, send_telegram=True, save_charts=False)"

