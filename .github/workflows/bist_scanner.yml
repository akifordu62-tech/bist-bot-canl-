name: BIST 30 Super Lider & Cift Kalkan Botu (V9.0)

on:
  schedule:
    # Hafta içi (Pzt-Cum) 15:17 UTC (18:17 TSİ — :00/:30 yoğunluk kuyruğu dışında yedek cron)
    # NOT: Tam 18:20 TSİ anlık çalışma için harici ücretsiz cron-job.org -> workflow_dispatch önerilir.
    # portfolio_state.json üzerinden aynı gün mükerrer gönderim otomatik engellenir.
    - cron: '17 15 * * 1-5'
    # Streamlit Cloud'un uyku moduna geçmesini önlemek için Pazar günü hafif ping
    - cron: '11 12 * * 0'
  repository_dispatch:
    types: [daily-bist-scan]
  workflow_dispatch: # GitHub web veya cron-job.org API ile anında (sıra beklemeden) tetiklenir
    inputs:
      force_send:
        description: 'Aynı gün daha önce gönderildiyse bile Telegram raporunu tekrar gönder'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bist30-daily-scan
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek (Checkout)
        uses: actions/checkout@v4

      - name: Streamlit Cloud Uyku Modunu Onle (Keep-Alive Ping)
        run: |
          echo "Streamlit Cloud uyanık tutuluyor..."
          curl -s -L -I "https://akif-bist-bot.streamlit.app" || true

      - name: Python 3.11 Kur
        if: github.event_name != 'schedule' || github.event.schedule == '17 15 * * 1-5'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari Yukle
        if: github.event_name != 'schedule' || github.event.schedule == '17 15 * * 1-5'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: BIST 30 V9.0 Super Lider Taramasini Calistir ve Telegrama Gonder
        if: github.event_name != 'schedule' || github.event.schedule == '17 15 * * 1-5'
        env:
          TELEGRAM_ENABLED: 'True'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TELEGRAM: ${{ inputs.force_send == true && 'True' || 'False' }}
        run: |
          python scanner.py

      - name: Portfoy Durumunu ve Guncellenen Ozel RSI Seviyelerini Kaydet
        if: github.event_name != 'schedule' || github.event.schedule == '17 15 * * 1-5'
        run: |
          git config user.name "BIST30-Portfolio-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio_state.json optimal_params.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update BIST 30 V9.0 portfolio state and optimal RSI params [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
