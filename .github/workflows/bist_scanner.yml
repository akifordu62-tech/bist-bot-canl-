name: BIST 100 Gunluk Otomatik Tarayici ve Telegram Botu

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) her gün 15:15 UTC (TSİ 18:15 borsa kapanışı)
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # GitHub web sitesinden manuel 'Run workflow' ile tetiklenebilir

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: BIST 100 Taramasini Calistir ve Telegrama Gonder
        env:
          TELEGRAM_ENABLED: 'True'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from scanner import scan_symbols; from bist_symbols import BIST_100_SYMBOLS; scan_symbols(BIST_100_SYMBOLS, send_telegram=True, save_charts=False)"
